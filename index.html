<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诗歌 · 一束</title>
    <style>
        /* 全局重置 & 字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f3ee;
            font-family: "Georgia", "Songti SC", "SimSun", serif;
            padding: 1.5rem;
        }

        /* 卡片容器 — 留白 & 柔和阴影 */
        .poem-card {
            max-width: 640px;
            width: 100%;
            background: #fefcf9;
            padding: 3rem 2.8rem;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
            transition: box-shadow 0.25s ease;
        }

        .poem-card:hover {
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.08);
        }

        /* 标题区域 */
        .poem-title {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            color: #2c2b28;
            text-align: center;
            margin-bottom: 0.3rem;
            font-family: "Georgia", "KaiTi", "楷体", serif;
        }

        .poem-author {
            text-align: center;
            font-size: 0.95rem;
            color: #8f8a84;
            letter-spacing: 0.2em;
            margin-bottom: 2.4rem;
            font-weight: 300;
            border-bottom: 1px solid #ece7e1;
            padding-bottom: 1.2rem;
        }

        /* 诗歌正文 — 行距舒适，居中 */
        .poem-body {
            font-size: 1.2rem;
            line-height: 2.2;
            color: #3a3733;
            text-align: center;
            white-space: pre-line;
            /* 保留换行 */
            font-weight: 350;
            letter-spacing: 0.02em;
        }

        .poem-body p {
            margin-bottom: 0.6rem;
        }

        /* 分隔装饰 (小点缀) */
        .divider {
            width: 48px;
            height: 2px;
            background: #d9d2ca;
            margin: 1.8rem auto 1.2rem;
            border-radius: 2px;
            opacity: 0.6;
        }

        /* 落款 / 日期 (极淡) */
        .poem-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #bcb6ae;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .poem-card {
                padding: 2rem 1.5rem;
            }
            .poem-title {
                font-size: 1.7rem;
            }
            .poem-body {
                font-size: 1.05rem;
                line-height: 2;
            }
        }
    </style>
</head>
<body>

    <div class="poem-card">

        <!-- 标题 & 作者 -->
        <h1 class="poem-title">一 束</h1>
        <div class="poem-author">—— 北岛 · 节选 ——</div>

        <!-- 诗歌正文 -->
        <div class="poem-body">
            <p>在我和世界之间<br />
            你是海湾，是帆<br />
            是缆绳忠实的两端</p>

            <p>你是喷泉，是风<br />
            是童年清脆的呼喊</p>

            <p>在我和世界之间<br />
            你是画框，是窗口<br />
            是开满野花的田园</p>

            <p>你是呼吸，是床头<br />
            是陪伴星星的夜晚</p>
        </div>

        <!-- 小小装饰线 -->
        <div class="divider"></div>

        <!-- 落款 -->
        <div class="poem-footer">—— 选自《北岛诗选》 · 片刻宁静 ——</div>

    </div>

</body>
</html>
